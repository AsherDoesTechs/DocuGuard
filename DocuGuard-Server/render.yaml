# DocuGuard Backend - Render Deployment Configuration

services:
  - type: web
    name: docuguard-api
    runtime: node
    region: oregon
    plan: free
    rootDir: DocuGuard-Server
    buildCommand: cd .. && npm install && cd DocuGuard-Server && npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_SSL
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      # Comma-separated allowlist read by middleware/security.js. Required in
      # production: with it unset, corsOptions() rejects every browser origin.
      # Native builds send no Origin header, so this only affects web clients.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # config/firebase.js runs .replace() on this at require time, and
      # controllers/documentController.js pulls in notificationService at boot.
      # Leaving it unset crashes startup rather than disabling push.
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: APP_DEEPLINK_SCHEME
        sync: false
      - key: AZURE_ENDPOINT
        sync: false
      - key: AZURE_KEY
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: DEBUG_LOG_FILE
        value: "/tmp/docuguard_debug.log"

databases:
  - name: docuguard-db
    databaseName: docuguard
    user: docuguard
    plan: free
    region: oregon